name: Frontend - CI/CD

on:
  workflow_dispatch:
    inputs:
      run-type:
        description: "Run type"
        required: true
        default: "Deploy"
        type: choice
        options:
          - Code-Quality
          - Deploy
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - "frontend/**.js"
      - "frontend/**.ts"
      - "frontend/**.tsx"
      - "frontend/**.json"
      - "frontend/**.lock"
      - "frontend/src/**"
      - "frontend/Dockerfile"

defaults:
  run:
    working-directory: ./frontend

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["16"]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install dependencies
        run: make clean_install_dev

      # TODO: fix lint errors
      # - name: Run Review Dog - Linter
      #   uses: reviewdog/action-eslint@v1
      #   with:
      #     level: "info"
      #     workdir: "./frontend/"
      #     fail_on_error: "true"

      # TODO: fix lint errors
      # - name: Run linter
      #   if: github.event_name != 'pull_request'
      #   run: make lint

      # TODO: add tests and fix cogerage tests errors
      # - name: Run coverage test
      #   run: make coverage-test

  build:
    name: Build
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: frontend/
          platforms: linux/amd64
          target: remote
          push: false
          tags: build:1.0.0
          build-args: |
            REACT_APP_API_URL=${{ vars.REACT_APP_API_URL }}
            REACT_APP_SENTRY_DSN=${{ secrets.REACT_APP_SENTRY_DSN }}
            REACT_APP_PUBLIC_URL=${{ vars.REACT_APP_PUBLIC_URL }}
          outputs: type=docker,dest=/tmp/docker_image.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: inputs.run-type == 'Deploy'
        with:
          retention-days: 1
          name: docker_image
          path: /tmp/docker_image.tar

  deploy:
    name: Push to ECR
    runs-on: ubuntu-latest
    needs: ["code-quality", "build"]
    if: needs.code-quality.result == 'success' && needs.build.result == 'success' && inputs.run-type == 'Deploy'
    environment: Production
    env:
      ECR_REPOSITORY: ${{ vars.resource_base_name }}-tfv2-frontend
      IMAGE_TAG: ${{ github.sha }}
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_FRONTEND }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: echo "IMAGE=$(echo $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG )" >> $GITHUB_ENV

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: docker_image
          path: /tmp

      - name: Load, tag and push Docker image
        run: |
          docker load --input /tmp/docker_image.tar
          docker tag build:1.0.0 ${{ env.IMAGE }}
          docker image ls -a
          docker push ${{ env.IMAGE }}
